<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$titulo · EcoHarmony Park</title>
</head>
<!-- Mail de confirmación con la estética de la pantalla de confirmación del
     sitio. Los clientes de correo ignoran las hojas de estilo: los estilos
     van en línea y la estructura, en tablas. -->
<body style="margin:0;padding:0;background:#f2e8cf;font-family:Lato,'Segoe UI',Arial,sans-serif;color:#1f2a1c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2e8cf;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
          <tr>
            <td style="background:#386641;border-radius:14px 14px 0 0;padding:14px 20px;">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="vertical-align:middle;"><img src="cid:$cid_logo" width="48" height="48" alt="" style="display:block;border:0;"></td>
                  <td style="vertical-align:middle;padding-left:12px;color:#f2e8cf;font-size:20px;font-weight:900;">EcoHarmony Park</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background:#fffdf7;border-radius:0 0 14px 14px;padding:28px 24px;text-align:center;">
              <table role="presentation" cellspacing="0" cellpadding="0" align="center">
                <tr>
                  <td width="72" height="72" align="center" style="width:72px;height:72px;border-radius:36px;background:#6a994e;color:#fffdf7;font-size:38px;font-weight:900;line-height:72px;">&#10003;</td>
                </tr>
              </table>
              <h1 style="margin:16px 0 8px;color:#386641;font-size:26px;font-weight:900;">$titulo</h1>
              <p style="margin:0 0 20px;font-size:17px;font-weight:700;">$resumen.</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2e8cf;border-radius:10px;text-align:left;">
                <tr>
                  <td style="padding:12px 16px 4px;color:#5b6656;">Compra n.º</td>
                  <td align="right" style="padding:12px 16px 4px;font-weight:700;">$numero</td>
                </tr>
                <tr>
                  <td style="padding:4px 16px;color:#5b6656;">Pase</td>
                  <td align="right" style="padding:4px 16px;font-weight:700;">$pase</td>
                </tr>
                <tr>
                  <td style="padding:4px 16px 12px;color:#5b6656;">$etiqueta_total</td>
                  <td align="right" style="padding:4px 16px 12px;font-weight:700;">$total</td>
                </tr>
              </table>
              $bloque_pago
              <p style="margin:20px 0 0;color:#5b6656;font-size:14px;">Tus entradas se verifican al ingresar al parque.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 12px;color:#5b6656;font-size:12px;">EcoHarmony Park · Mail automático de confirmación de compra</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
